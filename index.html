<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HAND WINDOW — 4 POINT FX</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Arial,sans-serif}
body{color:#fff}
#stage{position:fixed;inset:0;background:#080909}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camera{display:none}
#ui{position:fixed;inset:0;pointer-events:none}
#top{
 position:absolute;left:18px;right:18px;top:16px;
 display:flex;align-items:center;gap:9px;
 font:10px monospace;letter-spacing:.12em;color:rgba(255,255,255,.7)
}
.pip{width:7px;height:7px;border-radius:50%;background:#ff355d;box-shadow:0 0 10px #ff355d}
.pip.ok{background:#47ff9a;box-shadow:0 0 10px #47ff9a}
#status{padding:5px 8px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.28)}
#hint{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 text-align:center;transition:.3s;pointer-events:none
}
#hint strong{display:block;font:500 17px monospace;letter-spacing:.12em}
#hint span{display:block;margin-top:9px;font:10px monospace;color:#999;line-height:1.6}
#start{
 pointer-events:auto;margin-top:17px;padding:10px 17px;
 background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.3);
 color:white;font:10px monospace;letter-spacing:.12em;cursor:pointer
}
#start:hover{background:rgba(255,255,255,.12)}
#bottom{
 position:absolute;left:18px;right:18px;bottom:16px;
 display:flex;justify-content:space-between;align-items:end;
 font:9px monospace;color:rgba(255,255,255,.48)
}
#debug{
 position:absolute;right:18px;top:50px;text-align:right;
 font:9px monospace;line-height:1.7;color:rgba(255,255,255,.42)
}
#flash{
 position:absolute;inset:0;background:white;opacity:0;mix-blend-mode:screen;pointer-events:none
}
.hidden{opacity:0!important}
</style>
</head>
<body>
<div id="stage">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <canvas id="fx" style="display:none"></canvas>

  <div id="ui">
    <div id="top">
      <span class="pip" id="pip"></span>
      <span id="status">CAMERA OFFLINE</span>
      <span style="flex:1"></span>
      <span>HAND WINDOW / 4 POINTS</span>
    </div>

    <div id="hint">
      <strong>HAND WINDOW</strong>
      <span>Apri entrambe le mani.<br>Metti indice + pollice di ogni mano davanti alla camera.</span>
      <button id="start">ATTIVA CAMERA</button>
    </div>

    <div id="debug">
      <div>HANDS: <b id="hands">0</b>/2</div>
      <div>POINTS: <b id="points">0</b>/4</div>
      <div>WINDOW: <b id="window">OFF</b></div>
    </div>

    <div id="bottom">
      <span>INDEX / THUMB TRACKING</span>
      <span id="fps">0 FPS</span>
    </div>
    <div id="flash"></div>
  </div>
</div>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
const video = document.getElementById('camera');
const canvas = document.getElementById('canvas');
const fxCanvas = document.getElementById('fx');
const ctx = canvas.getContext('2d', {alpha:false});
const fxCtx = fxCanvas.getContext('2d', {willReadFrequently:true});
const startBtn = document.getElementById('start');
const hint = document.getElementById('hint');
const statusEl = document.getElementById('status');
const pip = document.getElementById('pip');
const handsEl = document.getElementById('hands');
const pointsEl = document.getElementById('points');
const windowEl = document.getElementById('window');
const fpsEl = document.getElementById('fps');
const flash = document.getElementById('flash');

let camera = null;
let running = false;
let latestHands = [];
let lastTime = performance.now();
let frames = 0;
let fps = 0;
let effectPhase = 0;
let lastGoodWindow = null;
let flashLevel = 0;

function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth*dpr);
  canvas.height = Math.floor(innerHeight*dpr);
  fxCanvas.width = canvas.width;
  fxCanvas.height = canvas.height;
}
addEventListener('resize',resize);
resize();

/*
  MediaPipe gives normalized coordinates.
  The camera is mirrored visually, so we mirror X as well.
*/
function point(lm){
  return {
    x:(1-lm.x)*canvas.width,
    y:lm.y*canvas.height
  };
}

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function handCenter(hand){
  return point(hand[9]);
}

/* Return thumb tip (4) + index tip (8) for each hand. */
function getFourPoints(results){
  if(!results.multiHandLandmarks || results.multiHandLandmarks.length < 2) return null;

  const hands = results.multiHandLandmarks.slice(0,2).map(h => ({
    center:handCenter(h),
    thumb:point(h[4]),
    index:point(h[8])
  }));

  // Left/right in the displayed image.
  hands.sort((a,b)=>a.center.x-b.center.x);

  const L=hands[0], R=hands[1];

  // Require the two fingers on each hand to be reasonably separated.
  if(distance(L.thumb,L.index)<24 || distance(R.thumb,R.index)<24) return null;

  return [L.thumb,L.index,R.index,R.thumb];
}

function convexOrder(points){
  const cx=points.reduce((s,p)=>s+p.x,0)/points.length;
  const cy=points.reduce((s,p)=>s+p.y,0)/points.length;
  return [...points].sort((a,b)=>
    Math.atan2(a.y-cy,a.x-cx)-Math.atan2(b.y-cy,b.x-cx)
  );
}

function quadArea(p){
  let a=0;
  for(let i=0;i<p.length;i++){
    const q=p[(i+1)%p.length];
    a += p[i].x*q.y-q.x*p[i].y;
  }
  return Math.abs(a)/2;
}

function drawNormal(){
  if(video.readyState<2)return;
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  ctx.restore();
}

/*
  This is the important part:
  the psychedelic effect is drawn into a separate canvas,
  then clipped to the quadrilateral made by the four fingertips.
*/
function drawEffect(poly){
  const W=canvas.width,H=canvas.height;

  // Source image.
  fxCtx.setTransform(1,0,0,1,0,0);
  fxCtx.globalCompositeOperation='source-over';
  fxCtx.filter='none';
  fxCtx.clearRect(0,0,W,H);

  // Main image.
  fxCtx.drawImage(video,0,0,W,H);

  // Color transformation.
  const image=fxCtx.getImageData(0,0,W,H);
  const d=image.data;
  const t=effectPhase;

  // Process every 4th pixel block for performance.
  // Strong posterized psychedelic look, similar to the reference.
  for(let y=0;y<H;y+=2){
    for(let x=0;x<W;x+=2){
      const i=(y*W+x)*4;
      const r=d[i],g=d[i+1],b=d[i+2];

      const lum=(r*.299+g*.587+b*.114)/255;
      const wave=Math.sin(x*.018 + y*.011 + t*4.0);
      const wave2=Math.sin(y*.025 - t*3.2);
      const band=Math.sin((lum*8.0)+t*2.2);

      // psychedelic channel remap
      const nr=Math.max(0,Math.min(255,
        r*(.55+lum*.9) + (1+wave)*42 + band*34));
      const ng=Math.max(0,Math.min(255,
        g*(.35+lum*.8) + (1-wave2)*48 + wave*24));
      const nb=Math.max(0,Math.min(255,
        b*(.45+lum*.95) + (1+wave2)*58 + band*42));

      d[i]=nr; d[i+1]=ng; d[i+2]=nb;
      // Fill 2x2 block.
      if(x+1<W){
        d[i+4]=nr;d[i+5]=ng;d[i+6]=nb;
      }
      if(y+1<H){
        const j=((y+1)*W+x)*4;
        d[j]=nr;d[j+1]=ng;d[j+2]=nb;
        if(x+1<W){d[j+4]=nr;d[j+5]=ng;d[j+6]=nb;}
      }
    }
  }
  fxCtx.putImageData(image,0,0);

  // Draw only the transformed source inside the hand window.
  const ordered=convexOrder(poly);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(ordered[0].x,ordered[0].y);
  for(let i=1;i<ordered.length;i++)ctx.lineTo(ordered[i].x,ordered[i].y);
  ctx.closePath();
  ctx.clip();

  // Slight moving zoom makes the effect feel alive.
  const zoom=1.025+Math.sin(t*2)*.008;
  const sw=W/zoom, sh=H/zoom;
  const sx=(W-sw)/2, sy=(H-sh)/2;
  ctx.drawImage(fxCanvas,sx,sy,sw,sh,0,0,W,H);
  ctx.restore();

  // Neon border exactly follows the four fingertips.
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(ordered[0].x,ordered[0].y);
  for(let i=1;i<ordered.length;i++)ctx.lineTo(ordered[i].x,ordered[i].y);
  ctx.closePath();

  ctx.shadowBlur=18;
  ctx.shadowColor='rgba(255,20,190,.9)';
  ctx.lineWidth=3;
  ctx.strokeStyle='rgba(255,0,180,.9)';
  ctx.stroke();

  ctx.shadowBlur=8;
  ctx.lineWidth=1;
  ctx.strokeStyle='rgba(30,255,245,.95)';
  ctx.stroke();
  ctx.restore();

  // Small bright points at the four corners.
  for(const p of ordered){
    ctx.beginPath();
    ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fillStyle='white';
    ctx.shadowBlur=12;
    ctx.shadowColor='#ff2bd6';
    ctx.fill();
  }
}

function render(){
  requestAnimationFrame(render);
  if(!running || video.readyState<2)return;

  drawNormal();

  let poly=null;
  if(latestHands.length>=2) poly=getFourPoints({multiHandLandmarks:latestHands});

  if(poly){
    const ordered=convexOrder(poly);
    const area=quadArea(ordered);
    const minArea=canvas.width*canvas.height*.025;
    const maxArea=canvas.width*canvas.height*.75;

    if(area>minArea && area<maxArea){
      lastGoodWindow=ordered;
      drawEffect(ordered);
      pointsEl.textContent='4';
      windowEl.textContent='ACTIVE';
      windowEl.style.color='#ff52e5';
      flashLevel=.03;
    }else{
      pointsEl.textContent='4';
      windowEl.textContent='MOVE';
    }
  }else{
    pointsEl.textContent=latestHands.length?String(Math.min(4,latestHands.length*2)):'0';
    windowEl.textContent='OFF';
    windowEl.style.color='';
  }

  effectPhase+=.018;
  flashLevel*=.92;
  flash.style.opacity=flashLevel;

  frames++;
  const now=performance.now();
  if(now-lastTime>500){
    fps=Math.round(frames*1000/(now-lastTime));
    fpsEl.textContent=fps+' FPS';
    frames=0;lastTime=now;
  }
}

const hands = new Hands({
  locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands:2,
  modelComplexity:1,
  minDetectionConfidence:.65,
  minTrackingConfidence:.6
});

hands.onResults(results=>{
  latestHands=results.multiHandLandmarks || [];
  handsEl.textContent=latestHands.length;
});

async function start(){
  startBtn.disabled=true;
  startBtn.textContent='AVVIO...';

  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:'user',
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject=stream;
    await video.play();

    camera = new Camera(video,{
      onFrame:async()=>{ await hands.send({image:video}); },
      width:1280,
      height:720
    });
    camera.start();

    running=true;
    hint.classList.add('hidden');
    statusEl.textContent='CAMERA ONLINE';
    pip.classList.add('ok');
  }catch(err){
    console.error(err);
    startBtn.disabled=false;
    startBtn.textContent='RIPROVA';
    statusEl.textContent='ACCESSO CAMERA NEGATO';
    alert('Per usare il sistema devi consentire l’accesso alla fotocamera. Apri l’HTML da localhost/HTTPS, non da un percorso file se il browser blocca la fotocamera.');
  }
}

startBtn.addEventListener('click',start);
render();
</script>
</body>
</html>
