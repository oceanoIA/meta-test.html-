<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Liquid Frame</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
*{box-sizing:border-box}
video{display:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#start{
 position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
 z-index:5;padding:13px 23px;border:1px solid #ffffff55;
 background:#050505bb;color:#fff;font:10px monospace;letter-spacing:.18em;
 backdrop-filter:blur(12px);border-radius:2px
}
#start.hidden{display:none}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="view"></canvas>
<button id="start">START</button>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const cam=document.getElementById('cam');
const view=document.getElementById('view');
const start=document.getElementById('start');
const ctx=view.getContext('2d',{alpha:false});
const effect=document.createElement('canvas');
const ectx=effect.getContext('2d',{willReadFrequently:true});
let W=innerWidth,H=innerHeight,D=Math.min(devicePixelRatio||1,1.5);
let detected=null,smooth=null,ready=false,t=0,last=performance.now(),processing=false;

function size(){
 W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.5);
 view.width=W*D;view.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);
 effect.width=Math.max(480,Math.floor(W*.55));
 effect.height=Math.max(320,Math.floor(H*.55));
}
size();addEventListener('resize',size);

function mirrorDraw(c,x,y,w,h){
 c.save();c.translate(w,0);c.scale(-1,1);c.drawImage(cam,0,0,w,h);c.restore();
}
function P(l){return{x:(1-l.x)*W,y:l.y*H}}
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function order(a){
 const cx=a.reduce((s,p)=>s+p.x,0)/4,cy=a.reduce((s,p)=>s+p.y,0)/4;
 return a.slice().sort((u,v)=>Math.atan2(u.y-cy,u.x-cx)-Math.atan2(v.y-cy,v.x-cx))
}
function area(a){let z=0;for(let i=0;i<4;i++){let q=a[(i+1)%4];z+=a[i].x*q.y-q.x*a[i].y}return Math.abs(z)/2}
function smoothQ(q){
 if(!q)return null;
 if(!smooth){smooth=q.map(p=>({...p}));return smooth}
 const k=.38;
 for(let i=0;i<4;i++){smooth[i].x+=(q[i].x-smooth[i].x)*k;smooth[i].y+=(q[i].y-smooth[i].y)*k}
 return smooth;
}

const hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});
hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.70,minTrackingConfidence:.65});
hands.onResults(r=>{
 const hs=r.multiHandLandmarks||[];
 if(hs.length!==2){detected=null;return}
 const a=hs.map(h=>({c:P(h[9]),a:P(h[4]),b:P(h[8])})).sort((x,y)=>x.c.x-y.c.x);
 const L=a[0],R=a[1],min=Math.max(22,Math.min(W,H)*.025);
 if(d(L.a,L.b)<min||d(R.a,R.b)<min){detected=null;return}
 const q=order([L.a,L.b,R.b,R.a]);
 const ar=area(q);
 if(ar<W*H*.02||ar>W*H*.65){detected=null;return}
 detected=q;
});

async function track(){
 if(!ready)return;
 if(processing)return;
 processing=true;
 try{await hands.send({image:cam})}catch(e){}
 processing=false;
}

function liquidImage(){
 const ew=effect.width,eh=effect.height;
 ectx.setTransform(1,0,0,1,0,0);
 ectx.clearRect(0,0,ew,eh);
 // mirrored camera at reduced resolution
 ectx.save();ectx.translate(ew,0);ectx.scale(-1,1);ectx.drawImage(cam,0,0,ew,eh);ectx.restore();

 const img=ectx.getImageData(0,0,ew,eh), px=img.data;
 // Strong but compact processing: displacement is created by sampling neighboring rows.
 // It mimics the reference's melted horizontal bands without a full-screen CPU effect.
 const copy=new Uint8ClampedArray(px);
 const tt=t;
 for(let y=0;y<eh;y++){
   const yn=y/eh;
   const wave=Math.sin(yn*19+tt*2.0)+.55*Math.sin(yn*43-tt*1.35);
   const shift=Math.round(wave*7);
   for(let x=0;x<ew;x++){
     let sx=x+shift+Math.round(Math.sin((x/ew)*10+tt)*3);
     if(sx<0)sx=0;if(sx>=ew)sx=ew-1;
     const si=(y*ew+sx)*4, i=(y*ew+x)*4;
     let r=copy[si],g=copy[si+1],b=copy[si+2];
     // posterize + hue-like channel exchange
     r=Math.round(r/32)*32;g=Math.round(g/32)*32;b=Math.round(b/32)*32;
     const chroma=Math.round((Math.sin(yn*30+tt*2.8)+1)*4);
     px[i]=Math.min(255,Math.max(0,r+chroma));
     px[i+1]=Math.min(255,Math.max(0,g+Math.round((1-Math.sin(yn*18+tt))*8)));
     px[i+2]=Math.min(255,Math.max(0,b+12+Math.round(Math.sin(x/ew*16-tt)*6)));
   }
 }
 ectx.putImageData(img,0,0);
}

function frame(now){
 requestAnimationFrame(frame);
 if(!ready)return;
 const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
 // untouched camera outside the hand window
 ctx.setTransform(D,0,0,D,0,0);
 ctx.clearRect(0,0,W,H);
 ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(cam,0,0,W,H);ctx.restore();

 const q=smoothQ(detected);
 if(q){
   liquidImage();
   ctx.save();
   ctx.beginPath();ctx.moveTo(q[0].x,q[0].y);
   for(let i=1;i<4;i++)ctx.lineTo(q[i].x,q[i].y);
   ctx.closePath();ctx.clip();

   // draw the transformed image ONLY inside the four-finger surface
   ctx.globalCompositeOperation='source-over';
   ctx.drawImage(effect,0,0,W,H);

   // thin chromatic edge like the reference, not a UI frame
   ctx.globalCompositeOperation='screen';
   ctx.lineWidth=1.2;
   ctx.strokeStyle='rgba(255,0,160,.42)';
   ctx.stroke();
   ctx.restore();
 }else{
   smooth=null;
 }
}
requestAnimationFrame(frame);

async function startCamera(){
 try{
   const stream=await navigator.mediaDevices.getUserMedia({
     audio:false,video:{facingMode:'user',width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:60}}
   });
   cam.srcObject=stream;await cam.play();
   ready=true;start.classList.add('hidden');
   setInterval(track,60);
 }catch(e){
   console.error(e);
   start.textContent='ALLOW CAMERA';
 }
}
start.onclick=startCamera;
</script>
</body>
</html>
