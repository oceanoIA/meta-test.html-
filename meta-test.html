<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Meta License Test</title>
    <style>
        body {
            background: #05080d;
            color: #00eaff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        button {
            background: transparent;
            border: 1px solid #00eaff;
            color: #00eaff;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:active {
            transform: scale(0.97);
        }

        #result {
            margin-top: 25px;
            max-width: 90%;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <h2>J.A.R.V.I.S.</h2>
    <p>Test Meta License — Llama Vision</p>

    <button onclick="acceptMeta()">
        ACCETTA META LICENSE
    </button>

    <div id="result"></div>

    <script>
        async function acceptMeta() {

            const result = document.getElementById("result");

            result.textContent = "Invio richiesta...";

            try {

                const response = await fetch(
                    "https://iao-ai-v3.oceano-masoud.workers.dev/",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            action: "accept_meta_license"
                        })
                    }
                );

                const data = await response.json();

                result.textContent =
                    JSON.stringify(data, null, 2);

            } catch (error) {

                result.textContent =
                    "ERRORE:\n" + error.message;

            }
        }
    </script>

</body>
</html>
